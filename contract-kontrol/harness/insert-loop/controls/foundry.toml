[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
offline = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 100
threads = 1
remappings = ["poseidon-solidity/=vendor/poseidon-solidity/"]
libraries = ["vendor/poseidon-solidity/PoseidonT3.sol:PoseidonT3:0x00000000000000000000000000000000000A1002"]
fs_permissions = [{ access = "read", path = "./runtime" }]
